<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Path for 'THE CUISINE' (Top arc) -->
    <path id="topOuterArc" d="M 60,250 A 190,190 0 0,1 440,250" />
    <!-- Path for 'RESTAURANT' (Bottom arc - left to right along bottom) -->
    <path id="bottomOuterArc" d="M 50,250 A 200,200 0 0,0 450,250" />
    <!-- Path for 'PREMIUM QUALITY FOOD' (Inner top arc) -->
    <path id="topInnerArc" d="M 110,250 A 140,140 0 0,1 390,250" />
  </defs>

  <!-- 1. Outer Ring 1 (Thick border) -->
  <circle cx="250" cy="250" r="238" fill="none" stroke="#131B0E" stroke-width="5" />

  <!-- 2. Outer Ring 2 (Thin accent border) -->
  <circle cx="250" cy="250" r="228" fill="none" stroke="#131B0E" stroke-width="2" />

  <!-- 3. Middle Ring -->
  <circle cx="250" cy="250" r="162" fill="none" stroke="#131B0E" stroke-width="2.5" />

  <!-- 4. CURVED TEXT: THE CUISINE -->
  <text fill="#131B0E" font-size="46" font-weight="800" letter-spacing="6" font-family="serif, 'Playfair Display', 'Cinzel'">
    <textPath href="#topOuterArc" startOffset="50%" text-anchor="middle">THE CUISINE</textPath>
  </text>

  <!-- 5. CURVED TEXT: RESTAURANT -->
  <text fill="#131B0E" font-size="44" font-weight="800" letter-spacing="7" font-family="serif, 'Playfair Display', 'Cinzel'">
    <textPath href="#bottomOuterArc" startOffset="50%" text-anchor="middle">RESTAURANT</textPath>
  </text>

  <!-- 6. CURVED TEXT: PREMIUM QUALITY FOOD -->
  <text fill="#131B0E" font-size="20" font-weight="600" letter-spacing="3" font-family="sans-serif, 'Plus Jakarta Sans'">
    <textPath href="#topInnerArc" startOffset="50%" text-anchor="middle">PREMIUM QUALITY FOOD</textPath>
  </text>

  <!-- 7. CENTER UTENSILS: FORK & SPOON -->
  <!-- Fork (Top-Left to Bottom-Right) -->
  <g transform="translate(250, 240) rotate(-40) translate(-250, -240)">
    <path d="M236,155 L236,195 C236,208 244,215 248,215 L248,315 C248,318 249,320 250,320 C251,320 252,318 252,315 L252,215 C256,215 264,208 264,195 L264,155" fill="none" stroke="#131B0E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="243" y1="155" x2="243" y2="190" stroke="#131B0E" stroke-width="3.5" stroke-linecap="round" />
    <line x1="250" y1="155" x2="250" y2="190" stroke="#131B0E" stroke-width="3.5" stroke-linecap="round" />
    <line x1="257" y1="155" x2="257" y2="190" stroke="#131B0E" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Spoon (Top-Right to Bottom-Left) -->
  <g transform="translate(250, 240) rotate(40) translate(-250, -240)">
    <path d="M250,155 C234,155 232,180 232,196 C232,208 242,215 247,215 L247,315 C247,318 249,320 250,320 C251,320 253,318 253,315 L253,215 C258,215 268,208 268,196 C268,180 266,155 250,155 Z" fill="none" stroke="#131B0E" stroke-width="4" stroke-linejoin="round" />
  </g>

  <!-- 8. SINCE 1995 TEXT AT BOTTOM -->
  <text x="250" y="335" text-anchor="middle" fill="#131B0E" font-size="18" font-weight="600" letter-spacing="2" font-family="serif, 'Playfair Display'">Since 1995</text>
</svg>
